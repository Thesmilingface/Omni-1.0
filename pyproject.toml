# Python service packaging
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smerka-ai-service"
version = "0.1.0"
description = "Local API and persistence service for the SMERKA desktop assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.6,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["service"]

[tool.pytest.ini_options]
pythonpath = ["service"]
testpaths = ["tests"]
